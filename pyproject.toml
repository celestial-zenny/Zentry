[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authgraph"
version = "0.1.0"
description = "Map the transitive authority graph behind a Solana token - who can freeze, seize, mint, or block your sells."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Azubuike Kelechi Ekuma" }]
keywords = ["solana", "security", "web3", "token-2022", "spl-token", "rug-pull", "blockchain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["requests>=2.28", "rich>=13.0", "typer>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/celestialz/authgraph"
Issues = "https://github.com/celestialz/authgraph/issues"

[project.scripts]
authgraph = "authgraph.cli:main"

[tool.setuptools.packages.find]
include = ["authgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
